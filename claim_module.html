<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claims Wizard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --clay:#2563eb;
  --clay-d:#1d4ed8;
  --tint:#e7effe;
  --cream:#ffffff;
  --ink:#0f172a;
  --muted:rgba(15,23,42,.58);
  --faint:rgba(15,23,42,.42);
  --hair:rgba(15,23,42,.14);
  --bg:#eef2f7;
}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--clay-d)}
button{font-family:inherit}

.card{
  width:1040px;height:480px;background:var(--cream);
  border:1px solid rgba(15,23,42,.09);border-radius:16px;
  box-shadow:0 1px 2px rgba(15,23,42,.03),0 12px 34px rgba(15,23,42,.06);
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}

.card-head{flex:none;height:56px;padding:0 26px;border-bottom:1px solid rgba(15,23,42,.07);display:flex;align-items:center;gap:16px}
.card-head .titles{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px}
.card-head .title{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:22px;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
.card-head .subtitle{font-size:14px;color:var(--faint);white-space:nowrap}
.pips{flex:none;display:flex;align-items:center;gap:7px}
.pip{width:10px;height:10px;border-radius:50%;border:none;padding:0}

.card-body{flex:1;min-height:0;overflow:hidden;padding:16px 26px 14px}
.card-body *{scrollbar-width:none;-ms-overflow-style:none}
.card-body *::-webkit-scrollbar{width:0;height:0;display:none}

.step3-left{scrollbar-width:thin;-ms-overflow-style:auto}
.step3-left::-webkit-scrollbar{width:5px;display:block}
.step3-left::-webkit-scrollbar-thumb{background:rgba(15,23,42,.18);border-radius:3px}

.step{height:100%}

/* Step 1 */
.step1-lead{flex:none;font-size:16px;color:var(--faint);margin-bottom:12px}
#step1:not([hidden]){display:flex;flex-direction:column}
.cause-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:12px}
.cause-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid var(--hair);background:var(--cream);color:var(--ink);border-radius:12px;cursor:pointer;padding:8px;transition:background 130ms,border-color 130ms,color 130ms}
.cause-btn .icon{display:grid;place-items:center;height:44px}
.cause-btn .label{font-size:17px;font-weight:500;line-height:1.2;text-align:center}
.cause-btn.on{border-color:var(--clay);background:var(--clay);color:var(--cream)}

/* Step 2 */
.step2{height:100%;display:flex;gap:28px;align-items:center}
.step2-diagram{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.car-wrap{position:relative;width:auto;max-width:100%;height:100%;max-height:320px;aspect-ratio:676/315;flex:none}
.car-wrap .car{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.point{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:50%;cursor:pointer;font-weight:400;font-size:20px;line-height:1;border:1.5px solid rgba(37,99,235,.6);background:rgba(255,255,255,.92);color:var(--clay);box-shadow:0 1px 3px rgba(15,23,42,.14);transition:background 130ms,border-color 130ms,color 130ms,box-shadow 130ms}
.point.on{border-color:#DC2626;background:#DC2626;color:var(--cream);box-shadow:0 0 0 5px rgba(220,38,38,.18)}

.step2-panel{flex:none;width:260px;height:100%;display:flex;flex-direction:column;border:1px solid rgba(15,23,42,.1);border-radius:12px;padding:18px 18px 16px}
.step2-panel-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.step2-panel-head .label{font-size:15px;font-weight:600;color:var(--ink);line-height:1.2}
.step2-panel-head .count{font-size:13px;font-weight:500}
.step2-panel-body{flex:1;min-height:0;overflow:auto;font-size:15px;line-height:1.55}

/* Step 3 */
.step3{display:flex;gap:30px;height:100%}
.step3-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:24px;overflow-y:auto}
.q-row{display:flex;align-items:center;gap:16px}
.q-text{flex:0 1 auto;min-width:0;font-size:17px;font-weight:500;line-height:1.25}
.q-num{color:rgba(15,23,42,.38);font-weight:600;margin-right:7px}
.opt-row{flex:none;display:flex;gap:9px}
.opt-btn{width:82px;height:40px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:var(--ink);background:var(--cream);border:1px solid var(--hair);border-radius:9px;cursor:pointer;transition:background 130ms,border-color 130ms}
.opt-btn.on{color:var(--cream);background:var(--clay);border-color:var(--clay);font-weight:600}

.q-block .q-text{margin-bottom:8px}
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.opt-grid .opt-btn{width:100%;height:40px;text-align:center;line-height:1.15;padding:4px 6px}

.step3-panel{flex:none;width:390px;height:100%;display:flex;flex-direction:column;border:1px solid rgba(15,23,42,.1);border-radius:12px;padding:16px 18px;overflow:hidden}
.step3-panel-title{flex:none;font-size:15px;font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:14px}
.notes-label{flex:none;font-size:14px;color:var(--faint);margin-bottom:6px}
.notes{flex:1;min-height:0;padding:12px 14px;font:400 15px/1.5 'Hanken Grotesk',sans-serif;color:var(--ink);background:#f1f5f9;border:1px solid rgba(15,23,42,.08);border-radius:10px;resize:none}

.doc-label{flex:none;margin-top:14px;display:flex;align-items:center;gap:13px;padding:14px 15px;border:1.5px dashed rgba(15,23,42,.28);background:var(--cream);border-radius:11px;cursor:pointer}
.doc-label.on{border-style:solid;border-color:rgba(37,99,235,.45);background:var(--tint)}
.doc-glyph{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;background:rgba(15,23,42,.06);color:var(--faint);font-size:18px;line-height:1}
.doc-label.on .doc-glyph{background:var(--clay);color:var(--cream)}
.doc-text{min-width:0;flex:1}
.doc-title{display:block;font-size:16px;font-weight:500;line-height:1.25}
.doc-sub{display:block;font-size:13.5px;color:rgba(15,23,42,.48);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Footer */
.card-foot{flex:none;height:68px;padding:0 26px;display:flex;align-items:center;gap:14px;border-top:1px solid rgba(15,23,42,.07)}
.back-btn{flex:none;padding:13px 22px;font-size:15px;font-weight:500;color:var(--ink);background:transparent;border:1px solid rgba(15,23,42,.14);border-radius:9px;cursor:pointer}
.back-btn:disabled{cursor:not-allowed;opacity:.35}
.hint{flex:1;min-width:0;font-size:15px;line-height:1.4}
.next-btn{flex:none;padding:14px 32px;font-size:15px;font-weight:600;color:#ffffff;background:var(--clay);border:none;border-radius:9px;cursor:pointer}
.next-btn:disabled{background:rgba(37,99,235,.42);cursor:not-allowed}

@media (max-height:440px){
  .card-head{height:46px}
  .card-foot{height:56px}
  .card-body{padding:12px 26px 10px}
  .step3-left{gap:10px}
  .q-row{gap:12px}
  .q-text{font-size:15px}
  .q-block .q-text{margin-bottom:4px}
  .opt-btn,.opt-grid .opt-btn{height:32px;font-size:14px}
  .cause-grid{gap:8px}
  .cause-btn .icon{height:34px}
  .cause-btn .icon svg{width:26px;height:26px}
  .cause-btn .label{font-size:15px}
}

/* Full-screen app shell (landscape wizard, no design-canvas chrome) */
html, body.wizard-body{
  margin:0;
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
body.wizard-body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--ink);
}

/* Outside true fullscreen, browser chrome can eat vertical space unpredictably -
   let the page scroll instead of clipping/overlapping content. */
body.wizard-body:not(.is-fs){
  overflow-y:auto;
  height:auto;
  min-height:100vh;
  min-height:100dvh;
  display:block;
}

.card--full{
  width:100vw;
  height:100vh;
  height:100dvh;
  max-width:100vw;
  border:none;
  border-radius:0;
  box-shadow:none;
}
body.wizard-body:not(.is-fs) .card--full{
  height:auto;
  min-height:100vh;
  min-height:100dvh;
}

/* Small, unobtrusive - going fullscreen is optional, the wizard itself is what matters */
.fullscreen-btn{
  position:fixed;
  top:12px;
  right:12px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  padding:0;
  color:var(--ink);
  background:rgba(255,255,255,.88);
  border:1px solid rgba(15,23,42,.14);
  border-radius:8px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(15,23,42,.14);
}
.fullscreen-btn:hover{background:var(--cream)}

/* Landscape-only app: gate portrait viewing behind a rotate prompt */
.rotate-gate{display:none}
@media (orientation:portrait){
  .rotate-gate{
    display:flex;
    position:fixed;
    inset:0;
    z-index:50;
    background:var(--ink);
    color:#fff;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    text-align:center;
    padding:32px;
  }
  .rotate-gate svg{width:56px;height:56px;animation:rotate-hint 1.6s ease-in-out infinite}
  .rotate-gate p{margin:0;font-family:'Hanken Grotesk',sans-serif;font-size:16px;line-height:1.5;color:rgba(255,255,255,.85);max-width:280px}
  @keyframes rotate-hint{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-90deg)}}
  .card--full, .fullscreen-btn{display:none}
}
</style>
</head>
<body class="wizard-body">

<div class="card card--full">

  <div class="card-head">
    <div class="titles">
      <span class="title" id="title"></span>
      <span class="subtitle" id="subtitle"></span>
    </div>
    <div class="pips" id="pips"></div>
  </div>

  <div class="card-body">
    <div id="step1" class="step" hidden>
      <div class="step1-lead">Another vehicle, a road user, an object, or an event</div>
      <div class="cause-grid" id="causeGrid"></div>
    </div>

    <div id="step2" class="step" hidden>
      <div class="step2">
        <div class="step2-diagram">
          <div class="car-wrap" id="carWrap"></div>
        </div>
        <div class="step2-panel">
          <div class="step2-panel-head">
            <span class="label">Selected areas</span>
            <span class="count" id="markedCount"></span>
          </div>
          <div class="step2-panel-body" id="regionCaption"></div>
        </div>
      </div>
    </div>

    <div id="step3" class="step" hidden>
      <div class="step3">
        <div class="step3-left" id="step3Left"></div>
        <div class="step3-panel">
          <div class="step3-panel-title">Supporting details</div>
          <div class="notes-label">Additional comments</div>
          <textarea id="notes" class="notes" placeholder="Anything more about how the damage happened"></textarea>
          <label id="docLabel" class="doc-label">
            <span class="doc-glyph" id="docGlyph">+</span>
            <span class="doc-text">
              <span class="doc-title" id="docTitle">Attach a PDF</span>
              <span class="doc-sub" id="docSub">Claim form or police report</span>
            </span>
            <input type="file" id="docInput" accept="application/pdf" style="display:none">
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="card-foot">
    <button class="back-btn" id="backBtn">Back</button>
    <div class="hint" id="hint"></div>
    <button class="next-btn" id="nextBtn"></button>
  </div>

</div>

<button id="fullscreenBtn" class="fullscreen-btn" title="Enter full screen" aria-label="Enter full screen" hidden>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
</button>

<div class="rotate-gate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"></rect><line x1="5" y1="6" x2="19" y2="6"></line><line x1="5" y1="18" x2="19" y2="18"></line></svg>
  <p>This claims wizard is built for landscape. Rotate your device to continue.</p>
</div>

<script>
"use strict";

const CAUSES = [
  { id: "heavy", label: "Heavy vehicle", icon: iconHeavy() },
  { id: "light", label: "Light vehicle", icon: iconLight() },
  { id: "person", label: "Person or animal", icon: iconPerson() },
  { id: "pole", label: "Fixed object", icon: iconPole() },
  { id: "falling", label: "Falling object", icon: iconFalling() },
  { id: "fire", label: "Fire or weather", icon: iconFire() },
  { id: "theft", label: "Theft or vandalism", icon: iconTheft() },
  { id: "other", label: "Other", icon: iconOther() },
];

// id/label intentionally mismatched in the source design (nose points right: "front" id
// sits at the tail, "rear" id sits at the nose) — kept as-authored, label is what renders.
const FACES = [
  { id: "front", label: "Rear bumper", left: 9, top: 46.5 },
  { id: "fl-corner", label: "Rear-left corner", left: 14, top: 25 },
  { id: "fr-corner", label: "Rear-right corner", left: 14, top: 70 },
  { id: "bonnet", label: "Boot lid", left: 16, top: 46 },
  { id: "windshield", label: "Rear windshield", left: 29, top: 46 },
  { id: "l-front", label: "Left side", left: 47.5, top: 18.1 },
  { id: "r-front", label: "Right side", left: 47.5, top: 85.7 },
  { id: "sunroof", label: "Roof", left: 44, top: 46 },
  { id: "l-rear", label: "Left wing mirror", left: 60.2, top: 15 },
  { id: "r-rear", label: "Right wing mirror", left: 60.2, top: 88.5 },
  { id: "roof", label: "Windshield", left: 66, top: 46 },
  { id: "rear-glass", label: "Bonnet", left: 82, top: 46 },
  { id: "rl-corner", label: "Front-left corner", left: 89, top: 23.2 },
  { id: "rr-corner", label: "Front-right corner", left: 89, top: 80.6 },
  { id: "rear", label: "Front bumper", left: 94, top: 46.5 },
];

const QUESTIONS = [
  { id: "drivable", text: "Can the vehicle still be driven?", options: ["Yes", "No"], multi: false },
  { id: "airbags", text: "Did any airbags deploy?", options: ["Driver", "Passenger", "Curtain", "None"], multi: true },
  { id: "glass", text: "Any glass damaged?", options: ["Windshield", "Rear windshield", "Left window", "Right window", "Sunroof", "None"], multi: true },
];

const state = {
  step: 1,
  cause: null,
  faces: {},
  answers: {},
  notes: "",
  doc: null,
};

function chosenFaces() {
  return FACES.filter((f) => state.faces[f.id]).map((f) => f.id);
}

function faceLabel(id) {
  const f = FACES.find((x) => x.id === id);
  return f ? f.label : "";
}

function ok() {
  if (state.step === 1) return !!state.cause;
  if (state.step === 2) return chosenFaces().length > 0;
  return QUESTIONS.every((q) => {
    const a = state.answers[q.id];
    return q.multi ? Array.isArray(a) && a.length > 0 : !!a;
  });
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ---------- render ----------

let lastStep = null;

function render() {
  const s = state.step;
  const titles = { 1: "How did the damage happen?", 2: "Where is the damage?", 3: "A few last things" };
  const subs = { 1: "Step 1 of 3", 2: "Step 2 of 3", 3: "Step 3 of 3" };
  const chosen = chosenFaces();
  const passes = ok();

  $("#title").textContent = titles[s];
  $("#subtitle").textContent = subs[s];

  renderPips(s);

  $("#step1").hidden = s !== 1;
  $("#step2").hidden = s !== 2;
  $("#step3").hidden = s !== 3;

  if (s === 1) renderStep1();
  if (s === 2) renderStep2(chosen);
  if (s === 3) renderStep3(lastStep !== 3);
  lastStep = s;

  const hints = {
    1: state.cause ? "Selected: " + (CAUSES.find((c) => c.id === state.cause) || {}).label : "Pick the one that hit you.",
    2: chosen.length ? chosen.length + " area" + (chosen.length === 1 ? "" : "s") + " marked" : "Tap + on each damaged area of the car.",
    3: passes ? "Ready to file." : "All three answers are needed.",
  };
  const hint = $("#hint");
  hint.textContent = hints[s];
  hint.style.color = passes ? "rgba(15,23,42,.45)" : "var(--clay-d)";

  const backBtn = $("#backBtn");
  backBtn.disabled = s === 1;

  const nextBtn = $("#nextBtn");
  nextBtn.textContent = s === 3 ? "Submit" : "Continue";
  nextBtn.disabled = !passes;
}

function renderPips(s) {
  const pips = $("#pips");
  pips.innerHTML = "";
  [1, 2, 3].forEach((n) => {
    const b = document.createElement("button");
    b.className = "pip";
    b.style.background = n === s ? "var(--clay)" : n < s ? "rgba(37,99,235,.45)" : "rgba(15,23,42,.14)";
    b.style.cursor = n < s ? "pointer" : "default";
    b.disabled = n >= s;
    b.addEventListener("click", () => setState({ step: n }));
    pips.appendChild(b);
  });
}

function renderStep1() {
  const grid = $("#causeGrid");
  grid.innerHTML = "";
  CAUSES.forEach((c) => {
    const on = state.cause === c.id;
    const btn = document.createElement("button");
    btn.className = "cause-btn" + (on ? " on" : "");
    btn.innerHTML = '<span class="icon">' + c.icon + '</span><span class="label">' + c.label + "</span>";
    btn.addEventListener("click", () => setState({ cause: c.id }));
    grid.appendChild(btn);
  });
}

function renderStep2(chosen) {

function renderStep3(freshEntry) {
  const left = $("#step3Left");
  left.innerHTML = "";

  const q1 = QUESTIONS[0];
  const row = document.createElement("div");
  row.className = "q-row";
  row.innerHTML = '<div class="q-text"><span class="q-num">1.</span>' + q1.text + '</div><div class="opt-row"></div>';
  const optRow = row.querySelector(".opt-row");
  q1.options.forEach((v) => {
    const on = state.answers[q1.id] === v;
    const b = document.createElement("button");
    b.className = "opt-btn" + (on ? " on" : "");
    b.textContent = v;
    b.addEventListener("click", () => answer(q1.id, v, false));
    optRow.appendChild(b);
  });
  left.appendChild(row);

  QUESTIONS.slice(1).forEach((q, i) => {
    const block = document.createElement("div");
    block.className = "q-block";
    block.innerHTML = '<div class="q-text"><span class="q-num">' + (i + 2) + '.</span>' + q.text + '</div><div class="opt-grid"></div>';
    const grid = block.querySelector(".opt-grid");
    q.options.forEach((v) => {
      const a = state.answers[q.id];
      const on = Array.isArray(a) && a.includes(v);
      const b = document.createElement("button");
      b.className = "opt-btn" + (on ? " on" : "");
      b.textContent = v;
      b.addEventListener("click", () => answer(q.id, v, true));
      grid.appendChild(b);
    });
    left.appendChild(block);
  });

  $("#notes").value = state.notes;

  const docLabel = $("#docLabel");
  docLabel.classList.toggle("on", !!state.doc);
  $("#docGlyph").textContent = state.doc ? "✓" : "+";
  $("#docTitle").textContent = state.doc ? "Document attached" : "Attach a PDF";
  $("#docSub").textContent = state.doc ? state.doc : "Claim form or police report";

  if (freshEntry) left.scrollTop = 0;
}

function answer(qid, value, multi) {
  const answers = { ...state.answers };
  if (!multi) {
    answers[qid] = value;
  } else {
    let arr = Array.isArray(answers[qid]) ? [...answers[qid]] : [];
    if (value === "None") {
      arr = arr.includes("None") ? [] : ["None"];
    } else {
      arr = arr.filter((x) => x !== "None");
      arr = arr.includes(value) ? arr.filter((x) => x !== value) : [...arr, value];
    }
    answers[qid] = arr;
  }
  setState({ answers });
}

document.addEventListener("DOMContentLoaded", () => {
  $("#backBtn").addEventListener("click", () => {
    if (state.step > 1) setState({ step: state.step - 1 });
  });

  $("#nextBtn").addEventListener("click", () => {
    if (!ok()) return;
    if (state.step < 3) {
      setState({ step: state.step + 1 });
    } else {
      setState({ step: 1, cause: null, faces: {}, answers: {}, notes: "", doc: null });
      $("#carWrap").dataset.built = "";
    }
  });

  $("#notes").addEventListener("change", (e) => setState({ notes: e.target.value }));

  $("#docInput").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) setState({ doc: f.name });
  });

  render();
});

// ---------- fullscreen toggle ----------

(function () {
  const btn = document.getElementById("fullscreenBtn");
  const root = document.documentElement;

  const request = root.requestFullscreen || root.webkitRequestFullscreen;
  const supported = !!request;

  function isFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function sync() {
    btn.hidden = !supported || isFullscreen();
    document.body.classList.toggle("is-fs", isFullscreen());
  }

  if (!supported) return;

  btn.addEventListener("click", () => {
    request.call(root).catch(() => {});
  });

  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);

  sync();
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Camera Access Demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 101%;
    background: #0b0c10;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p.sub { color: #a0a0a0; margin-top: 0; margin-bottom: 32px; font-size: 0.95rem; }

  .perm-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 16px;
    padding: 14px 16px;
    background: #17181d;
    border-radius: 12px;
  }
  .perm-row .label { flex: 1; text-align: left; font-size: 0.95rem; }
  .status-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #555; flex-shrink: 0;
  }
  .status-dot.ok { background: #34c759; }
  .status-dot.no { background: #ff453a; }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    background: #2a2c33;
    color: #fff;
  }
  button:active { opacity: 0.8; }

  .proceed-btn {
    margin-top: 24px;
    width: 100%;
    max-width: 340px;
    padding: 14px;
    font-size: 1rem;
    background: #0a84ff;
  }
  .proceed-btn:disabled {
    background: #2a2c33;
    color: #777;
    cursor: not-allowed;
  }

  #page2 {
    display: none;
    padding: 0;
    position: relative;
    height: 100vh;
    width: 100vw;
    background: #000;
  }

  #camera-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 16px;
    z-index: 5;
  }

  .torch-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
  }
  .torch-btn.active {
    background: #ffd60a;
    color: #000;
  }

  /* Rotate-to-landscape overlay */
  .rotate-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5,5,8,0.97);
    z-index: 999;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .rotate-overlay.visible { display: flex; }
  .rotate-icon {
    font-size: 3.4rem;
    margin-bottom: 16px;
    animation: tilt 1.4s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes tilt {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }
  .rotate-overlay p { max-width: 280px; color: #ccc; }
  .rotate-overlay button {
    margin-top: 20px;
    background: #0a84ff;
    padding: 12px 22px;
  }
  .small-note { font-size: 0.75rem; color: #666; margin-top: 10px; max-width: 280px; }
</style>
</head>
<body>

<!-- PAGE 1: Permissions -->
<div class="page" id="page1">
  <h1>Enable Camera & Motion Access</h1>
  <p class="sub">We need these two permissions before opening the camera.</p>

  <div class="perm-row">
    <div class="status-dot" id="dot-camera"></div>
    <div class="label" id="label-camera">Camera access</div>
    <button id="btn-camera">Allow</button>
  </div>

  <div class="perm-row">
    <div class="status-dot" id="dot-gyro"></div>
    <div class="label" id="label-gyro">Motion / gyroscope</div>
    <button id="btn-gyro">Allow</button>
  </div>

  <button class="proceed-btn" id="btn-proceed" disabled>Proceed</button>
  <p class="small-note" id="page1-note"></p>
</div>

<!-- PAGE 2: Camera -->
<div id="page2">
  <video id="camera-video" autoplay playsinline muted></video>

  <div class="controls">
    <button class="torch-btn" id="btn-torch" title="Flashlight / Torch">🔦</button>
  </div>

  <div class="rotate-overlay" id="rotate-overlay">
    <span class="rotate-icon" id="rotate-icon">📱</span>
    <p id="rotate-text">Please rotate your device to landscape to use the camera.</p>
    <button id="btn-force-landscape" style="display:none;">Go Fullscreen Landscape</button>
  </div>
</div>

<script>
(function () {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  let mediaStream = null;
  let torchOn = false;

  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const video = document.getElementById('camera-video');
  const rotateOverlay = document.getElementById('rotate-overlay');
  const rotateIcon = document.getElementById('rotate-icon');
  const rotateText = document.getElementById('rotate-text');
  const forceLandscapeBtn = document.getElementById('btn-force-landscape');
  const page1Note = document.getElementById('page1-note');

  const dotCamera = document.getElementById('dot-camera');
  const dotGyro = document.getElementById('dot-gyro');
  const btnCamera = document.getElementById('btn-camera');
  const btnGyro = document.getElementById('btn-gyro');
  const btnProceed = document.getElementById('btn-proceed');
  const btnTorch = document.getElementById('btn-torch');

  let cameraGranted = false;
  let gyroGranted = false;

  function updateProceedState() {
    // Allow proceeding once camera is granted; gyro is best-effort on many browsers.
    btnProceed.disabled = !cameraGranted;
  }

  // ---- Camera permission ----
  btnCamera.addEventListener('click', async () => {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      cameraGranted = true;
      dotCamera.classList.add('ok');
      btnCamera.textContent = 'Granted';
      btnCamera.disabled = true;
    } catch (err) {
      cameraGranted = false;
      dotCamera.classList.add('no');
      btnCamera.textContent = 'Denied - retry';
      page1Note.textContent = 'Camera access was blocked. Check browser settings and try again.';
    }
    updateProceedState();
  });

  // ---- Gyroscope permission ----
  btnGyro.addEventListener('click', async () => {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ requires this to be called from a direct user gesture.
        const result = await DeviceOrientationEvent.requestPermission();
        gyroGranted = (result === 'granted');
      } else if ('DeviceOrientationEvent' in window) {
        // Most non-iOS browsers don't need explicit permission.
        gyroGranted = true;
      } else {
        gyroGranted = false;
      }
    } catch (err) {
      gyroGranted = false;
    }
    dotGyro.classList.add(gyroGranted ? 'ok' : 'no');
    btnGyro.textContent = gyroGranted ? 'Granted' : 'Not available';
    btnGyro.disabled = true;
    updateProceedState();
  });

  // ---- Fullscreen + landscape lock trigger (shared by Proceed button and rotate prompt) ----
  function attemptFullscreenLandscape() {
    const el = document.documentElement;
    const requestFS = el.requestFullscreen || el.webkitRequestFullscreen;

    const lockLandscape = () => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    };

    if (requestFS) {
      try {
        const p = requestFS.call(el);
        if (p && p.then) {
          p.then(lockLandscape).catch(lockLandscape);
        } else {
          lockLandscape();
        }
      } catch (e) {
        lockLandscape();
      }
    } else {
      lockLandscape();
    }

    // iOS ignores both of the above, so this is the fallback "hack":
    // once the user physically rotates, collapse the Safari URL bar.
    if (isIOS) {
      runScrollHack();
    }
  }

  // ---- Tier 2: persistent scroll hack for iOS Safari ----
  // A single scrollTo(0,1) on load/rotate is unreliable, especially when
  // Safari has multiple tabs open (it can keep the bar "overlayed" instead
  // of collapsing it). We retry for a short burst and also nudge it on
  // real scroll/touch gestures, since Safari sometimes only responds to
  // an actual user-driven scroll rather than a single programmatic call.
  let scrollHackTimer = null;

  function runScrollHack() {
    if (!isIOS) return;
    if (scrollHackTimer) clearInterval(scrollHackTimer);
    unlockPageScroll(); // make sure there's scroll room to work with

    let attempts = 0;
    scrollHackTimer = setInterval(() => {
      // small nudge down then settle at 1px, mimics a real swipe better
      // than jumping straight to scrollTo(0,1) every time
      window.scrollTo(0, 2);
      window.scrollTo(0, 1);
      attempts++;
      if (attempts >= 12) { // ~1.2s of retries
        clearInterval(scrollHackTimer);
        scrollHackTimer = null;
        // Once the bar has (hopefully) collapsed, freeze the page so a
        // later scroll or pull gesture can't bring it back - there's
        // simply nothing left to scroll.
        lockPageScroll();
      }
    }, 100);
  }

  // ---- Freeze/unfreeze page scroll ----
  // Freezing after the bar is hidden removes the scrollable surface a
  // later swipe would use to reveal it again. We only need scroll room
  // briefly, to run the hide sequence itself.
  let touchMoveBlocker = null;

  function lockPageScroll() {
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.width = '100%';
    document.body.style.height = '100%';

    if (!touchMoveBlocker) {
      touchMoveBlocker = (e) => e.preventDefault();
      document.addEventListener('touchmove', touchMoveBlocker, { passive: false });
    }
  }

  function unlockPageScroll() {
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    document.body.style.position = '';
    document.body.style.width = '';
    document.body.style.height = '';

    if (touchMoveBlocker) {
      document.removeEventListener('touchmove', touchMoveBlocker);
      touchMoveBlocker = null;
    }
  }

  // Re-nudge on any real scroll, in case the user's own gesture is what
  // finally gets Safari to collapse the bar (only relevant while unlocked).
  function isPortrait() {
    try { return window.matchMedia('(orientation: portrait)').matches; }
    catch (e) { return false; }
  }

  window.addEventListener('scroll', () => {
    if (isIOS && page2.style.display !== 'none' && !isPortrait()) {
      window.scrollTo(0, window.pageYOffset < 1 ? 1 : window.pageYOffset);
    }
  }, { passive: true });

  let landscapeConfirmed = false;

  function refreshOrientationUI() {
    if (page2.style.display === 'none') return; // only enforce on page 2

    if (isPortrait()) {
      landscapeConfirmed = false;
      if (isIOS) unlockPageScroll();
      rotateOverlay.classList.add('visible');
      rotateIcon.style.display = 'inline-block';
      if (isIOS) {
        rotateText.textContent = 'Please rotate your device to landscape to use the camera.';
        forceLandscapeBtn.style.display = 'none';
      } else {
        rotateText.textContent = 'This camera view works best in landscape.';
        forceLandscapeBtn.style.display = 'inline-block';
      }
    } else if (isIOS && !landscapeConfirmed) {
      // Landscape reached, but we deliberately do NOT auto-hide the overlay
      // or run the scroll hack here. An orientationchange-triggered call is
      // not treated as a trusted user gesture on iOS, so it's unreliable at
      // collapsing the address bar. Instead we ask for one tap, which is a
      // real gesture Safari will honor.
      rotateIcon.style.display = 'none';
      rotateText.textContent = "You're in landscape. Tap continue to enter the camera view.";
      forceLandscapeBtn.style.display = 'inline-block';
      forceLandscapeBtn.textContent = 'Continue';
      rotateOverlay.classList.add('visible');
    } else {
      rotateOverlay.classList.remove('visible');
    }
  }

  function confirmLandscapeTap() {
    landscapeConfirmed = true;
    rotateOverlay.classList.remove('visible');
    forceLandscapeBtn.textContent = 'Go Fullscreen Landscape';
    // This call happens directly inside a click handler, i.e. a real user
    // gesture - the case that has actually worked reliably.
    runScrollHack();
  }

  forceLandscapeBtn.addEventListener('click', () => {
    if (isIOS && isPortrait() === false && !landscapeConfirmed) {
      confirmLandscapeTap();
    } else {
      attemptFullscreenLandscape();
    }
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(refreshOrientationUI, 250);
  });
  window.addEventListener('resize', refreshOrientationUI);

  // ---- Proceed to camera page ----
  btnProceed.addEventListener('click', () => {
    page1.style.display = 'none';
    page2.style.display = 'block';

    if (mediaStream) {
      video.srcObject = mediaStream;
    }

    attemptFullscreenLandscape();
    refreshOrientationUI();
  });

  // ---- Torch / flashlight ----
  btnTorch.addEventListener('click', async () => {
    if (!mediaStream) return;
    const track = mediaStream.getVideoTracks()[0];
    const capabilities = track.getCapabilities ? track.getCapabilities() : {};

    if (capabilities && capabilities.torch) {
      torchOn = !torchOn;
      try {
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        btnTorch.classList.toggle('active', torchOn);
      } catch (e) {
        alert('Could not toggle torch: ' + e.message);
      }
    } else {
      alert('Torch control is not supported on this browser/device. iOS Safari does not expose torch control via web APIs.');
    }
  });
})();
</script>

</body>
</html>

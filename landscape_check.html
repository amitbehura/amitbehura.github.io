<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Camera Access Demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 101%;
    background: #0b0c10;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p.sub { color: #a0a0a0; margin-top: 0; margin-bottom: 32px; font-size: 0.95rem; }

  .perm-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 340px;
    margin-bottom: 16px;
    padding: 14px 16px;
    background: #17181d;
    border-radius: 12px;
  }
  .perm-row .label { flex: 1; text-align: left; font-size: 0.95rem; }
  .status-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #555; flex-shrink: 0;
  }
  .status-dot.ok { background: #34c759; }
  .status-dot.no { background: #ff453a; }

  button {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    background: #2a2c33;
    color: #fff;
  }
  button:active { opacity: 0.8; }

  .proceed-btn {
    margin-top: 24px;
    width: 100%;
    max-width: 340px;
    padding: 14px;
    font-size: 1rem;
    background: #0a84ff;
  }
  .proceed-btn:disabled {
    background: #2a2c33;
    color: #777;
    cursor: not-allowed;
  }

  #page2 {
    display: none;
    padding: 0;
    position: relative;
    width: 100vw;
    background: #000;
    /* Real scroll room: tall enough for one genuine swipe. */
    min-height: 180vh;
  }

  .camera-layer {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #000;
  }

  #camera-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 16px;
    z-index: 5;
  }

  .torch-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
  }
  .torch-btn.active {
    background: #ffd60a;
    color: #000;
  }

  /* Normal-flow scroll track sitting above the fixed camera layer.
     Scrolling this is what triggers Safari's real chrome-shrink. */
  #scroll-track {
    position: relative;
    z-index: 2;
  }
  #scroll-spacer {
    height: 80vh;
  }

  .rotate-overlay {
    height: 100vh;
    width: 100%;
    background: rgba(5,5,8,0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .rotate-overlay.hidden { display: none; }
  .rotate-icon {
    font-size: 3.4rem;
    margin-bottom: 16px;
    animation: tilt 1.4s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes tilt {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-90deg); }
  }
  .rotate-overlay p { max-width: 280px; color: #ccc; }
  .rotate-overlay button {
    margin-top: 20px;
    background: #0a84ff;
    padding: 12px 22px;
  }
  .small-note { font-size: 0.75rem; color: #666; margin-top: 10px; max-width: 280px; }
</style>
</head>
<body>

<!-- PAGE 1: Permissions -->
<div class="page" id="page1">
  <h1>Enable Camera & Motion Access</h1>
  <p class="sub">We need these two permissions before opening the camera.</p>

  <div class="perm-row">
    <div class="status-dot" id="dot-camera"></div>
    <div class="label" id="label-camera">Camera access</div>
    <button id="btn-camera">Allow</button>
  </div>

  <div class="perm-row">
    <div class="status-dot" id="dot-gyro"></div>
    <div class="label" id="label-gyro">Motion / gyroscope</div>
    <button id="btn-gyro">Allow</button>
  </div>

  <button class="proceed-btn" id="btn-proceed" disabled>Proceed</button>
  <p class="small-note" id="page1-note"></p>
</div>

<!-- PAGE 2: Camera -->
<div id="page2">
  <!-- Fixed layer: always full-screen, never moves even while the
       scroll-track above it is being dragged. -->
  <div class="camera-layer">
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="controls">
      <button class="torch-btn" id="btn-torch" title="Flashlight / Torch">🔦</button>
    </div>
  </div>

  <!-- Real, normal-flow scrollable content stacked on top. Swiping this
       is a genuine touch-scroll, which is what actually gets Safari to
       shrink its own chrome - unlike a synthetic scrollTo() call. -->
  <div id="scroll-track">
    <div class="rotate-overlay" id="rotate-overlay">
      <span class="rotate-icon" id="rotate-icon">📱</span>
      <p id="rotate-text">Please rotate your device to landscape to use the camera.</p>
      <button id="btn-force-landscape" style="display:none;">Go Fullscreen Landscape</button>
    </div>
    <div id="scroll-spacer"></div>
  </div>
</div>

<script>
(function () {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

  let mediaStream = null;
  let torchOn = false;

  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const video = document.getElementById('camera-video');
  const rotateOverlay = document.getElementById('rotate-overlay');
  const rotateIcon = document.getElementById('rotate-icon');
  const rotateText = document.getElementById('rotate-text');
  const forceLandscapeBtn = document.getElementById('btn-force-landscape');
  const page1Note = document.getElementById('page1-note');

  const dotCamera = document.getElementById('dot-camera');
  const dotGyro = document.getElementById('dot-gyro');
  const btnCamera = document.getElementById('btn-camera');
  const btnGyro = document.getElementById('btn-gyro');
  const btnProceed = document.getElementById('btn-proceed');
  const btnTorch = document.getElementById('btn-torch');

  let cameraGranted = false;
  let gyroGranted = false;

  function updateProceedState() {
    // Allow proceeding once camera is granted; gyro is best-effort on many browsers.
    btnProceed.disabled = !cameraGranted;
  }

  // ---- Camera permission ----
  btnCamera.addEventListener('click', async () => {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      cameraGranted = true;
      dotCamera.classList.add('ok');
      btnCamera.textContent = 'Granted';
      btnCamera.disabled = true;
    } catch (err) {
      cameraGranted = false;
      dotCamera.classList.add('no');
      btnCamera.textContent = 'Denied - retry';
      page1Note.textContent = 'Camera access was blocked. Check browser settings and try again.';
    }
    updateProceedState();
  });

  // ---- Gyroscope permission ----
  btnGyro.addEventListener('click', async () => {
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ requires this to be called from a direct user gesture.
        const result = await DeviceOrientationEvent.requestPermission();
        gyroGranted = (result === 'granted');
      } else if ('DeviceOrientationEvent' in window) {
        // Most non-iOS browsers don't need explicit permission.
        gyroGranted = true;
      } else {
        gyroGranted = false;
      }
    } catch (err) {
      gyroGranted = false;
    }
    dotGyro.classList.add(gyroGranted ? 'ok' : 'no');
    btnGyro.textContent = gyroGranted ? 'Granted' : 'Not available';
    btnGyro.disabled = true;
    updateProceedState();
  });

  // ---- Fullscreen + landscape lock trigger (Android/Chrome path) ----
  function attemptFullscreenLandscape() {
    const el = document.documentElement;
    const requestFS = el.requestFullscreen || el.webkitRequestFullscreen;

    const lockLandscape = () => {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    };

    if (requestFS) {
      try {
        const p = requestFS.call(el);
        if (p && p.then) {
          p.then(lockLandscape).catch(lockLandscape);
        } else {
          lockLandscape();
        }
      } catch (e) {
        lockLandscape();
      }
    } else {
      lockLandscape();
    }
  }

  // ---- iOS: real-swipe trick ----
  // iOS Safari doesn't support the Fullscreen API for regular pages and
  // ignores programmatic scrollTo()/tap-triggered calls for shrinking its
  // toolbar. What DOES work (the same mechanism e-commerce sites get for
  // free) is a genuine, physical touch-scroll on real scrollable content.
  // #scroll-track supplies that real content; the camera itself lives in
  // a `position: fixed` layer underneath so it never visually moves while
  // the user swipes the track out of the way.
  const scrollTrack = document.getElementById('scroll-track');
  const SWIPE_THRESHOLD = 30; // px of real scroll before we consider it "done"

  let touchMoveBlocker = null;

  function lockPageScroll() {
    // Deliberately NOT touching overflow/position here. Setting
    // overflow:hidden collapses the scrollable range, which resets the
    // document's scroll offset back to 0 - and that reset-to-top is
    // exactly the motion that makes Safari re-expand the bar it just
    // collapsed. Blocking touchmove alone prevents further scrolling
    // without disturbing the offset Safari already collapsed for.
    if (!touchMoveBlocker) {
      touchMoveBlocker = (e) => e.preventDefault();
      document.addEventListener('touchmove', touchMoveBlocker, { passive: false });
    }
  }

  function unlockPageScroll() {
    if (touchMoveBlocker) {
      document.removeEventListener('touchmove', touchMoveBlocker);
      touchMoveBlocker = null;
    }
    window.scrollTo(0, 0);
  }

  function isPortrait() {
    try { return window.matchMedia('(orientation: portrait)').matches; }
    catch (e) { return false; }
  }

  let landscapeConfirmed = false;

  window.addEventListener('scroll', () => {
    if (!isIOS || page2.style.display === 'none') return;
    if (isPortrait() || landscapeConfirmed) return;

    // A real swipe happened - this is the genuine touch-scroll that gets
    // Safari to shrink its own chrome, unlike anything we could fake.
    if (window.pageYOffset > SWIPE_THRESHOLD) {
      landscapeConfirmed = true;
      rotateOverlay.classList.add('hidden');
      // Do NOT scroll back toward 0/1 here - that motion itself reads as
      // "scrolling back up" to Safari and can re-expand the bar it just
      // shrank. Just freeze the page wherever the real swipe left it.
      setTimeout(() => {
        lockPageScroll();
        // Remove the scroll-track entirely - its spacer is transparent
        // but still sits above the fixed camera layer in stacking order
        // and would otherwise block taps on the torch button.
        scrollTrack.style.display = 'none';
      }, 150);
    }
  }, { passive: true });

  function refreshOrientationUI() {
    if (page2.style.display === 'none') return; // only enforce on page 2

    if (isPortrait()) {
      landscapeConfirmed = false;
      if (isIOS) unlockPageScroll();
      scrollTrack.style.display = '';
      rotateOverlay.classList.remove('hidden');
      rotateIcon.style.display = 'inline-block';
      if (isIOS) {
        rotateText.textContent = 'Please rotate your device to landscape to use the camera.';
        forceLandscapeBtn.style.display = 'none';
      } else {
        rotateText.textContent = 'This camera view works best in landscape.';
        forceLandscapeBtn.style.display = 'inline-block';
      }
    } else if (isIOS && !landscapeConfirmed) {
      // Landscape reached. Ask for one real swipe (not a tap) - that's
      // the gesture Safari's own chrome-shrink logic actually listens to.
      rotateIcon.style.display = 'none';
      rotateText.textContent = "You're in landscape - swipe up to continue.";
      forceLandscapeBtn.style.display = 'none';
      rotateOverlay.classList.remove('hidden');
    } else if (!isIOS) {
      rotateOverlay.classList.add('hidden');
    }
  }

  forceLandscapeBtn.addEventListener('click', attemptFullscreenLandscape);

  window.addEventListener('orientationchange', () => {
    setTimeout(refreshOrientationUI, 250);
  });
  window.addEventListener('resize', refreshOrientationUI);

  // ---- Proceed to camera page ----
  btnProceed.addEventListener('click', () => {
    page1.style.display = 'none';
    page2.style.display = 'block';

    if (mediaStream) {
      video.srcObject = mediaStream;
    }

    attemptFullscreenLandscape();
    refreshOrientationUI();
  });

  // ---- Torch / flashlight ----
  btnTorch.addEventListener('click', async () => {
    if (!mediaStream) return;
    const track = mediaStream.getVideoTracks()[0];
    const capabilities = track.getCapabilities ? track.getCapabilities() : {};

    if (capabilities && capabilities.torch) {
      torchOn = !torchOn;
      try {
        await track.applyConstraints({ advanced: [{ torch: torchOn }] });
        btnTorch.classList.toggle('active', torchOn);
      } catch (e) {
        alert('Could not toggle torch: ' + e.message);
      }
    } else {
      alert('Torch control is not supported on this browser/device. iOS Safari does not expose torch control via web APIs.');
    }
  });
})();
</script>

</body>
</html>

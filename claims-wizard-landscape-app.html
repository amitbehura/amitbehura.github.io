<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims Wizard — landscape</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root{
  --clay:#2563eb;
  --clay-d:#1d4ed8;
  --tint:#e7effe;
  --cream:#ffffff;
  --ink:#0f172a;
  --hair:rgba(15,23,42,.14);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  background:#000;
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
}
button{font-family:inherit}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}

/* Landscape phone frame — 844 x 390 (20:9 rotated) */
.frame{
  width:844px;
  height:390px;
  background:#ffffff;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
}

.wizard-header{
  flex:none;
  height:50px;
  padding:0 20px;
  border-bottom:1px solid rgba(15,23,42,.07);
  display:flex;
  align-items:center;
  gap:14px;
}
.wizard-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px}
.title-main{
  font-family:'Newsreader',Georgia,serif;
  font-weight:400;
  font-size:19px;
  line-height:1.15;
  letter-spacing:-.01em;
  white-space:nowrap;
}
.title-sub{font-size:12.5px;color:rgba(15,23,42,.42);white-space:nowrap}
.pips{flex:none;display:flex;align-items:center;gap:6px}
.pip{width:9px;height:9px;border-radius:50%;border:none;padding:0}

.wizard-body{flex:1;min-height:0;overflow:hidden;padding:12px 20px 10px}

.wizard-footer{
  flex:none;
  height:56px;
  padding:0 20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-top:1px solid rgba(15,23,42,.07);
}
.btn{font-family:'Hanken Grotesk',sans-serif;border-radius:8px;cursor:pointer}
.btn-back{
  flex:none;padding:10px 18px;font-size:13.5px;font-weight:500;
  color:var(--ink);background:transparent;border:1px solid rgba(15,23,42,.14);
}
.hint{flex:1;min-width:0;font-size:13.5px;line-height:1.35}
.btn-next{flex:none;padding:11px 26px;font-size:13.5px;font-weight:600;color:#fff;border:none}

/* step 1 */
.step1-label{font-size:13.5px;color:rgba(15,23,42,.5);margin-bottom:9px}
.cause-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,92px);gap:9px}
.cause-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border-radius:10px;cursor:pointer;padding:6px;
  transition:background 130ms,border-color 130ms,color 130ms;font-family:'Hanken Grotesk',sans-serif;
}
.cause-icon{display:grid;place-items:center;height:32px}
.cause-icon svg{width:26px;height:26px}
.cause-label{font-size:13px;font-weight:500;line-height:1.15;text-align:center}

/* step 2 */
.step2-layout{height:100%;display:flex;gap:20px;align-items:center}
.map-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.map-wrap{position:relative;width:100%;max-width:480px;height:230px;flex:none}
.map-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.hotspot{
  position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;
  display:grid;place-items:center;border-radius:50%;cursor:pointer;
  font-family:'Hanken Grotesk',sans-serif;font-weight:400;font-size:15px;line-height:1;
  transition:background 130ms,border-color 130ms,color 130ms,box-shadow 130ms;
}
.side-panel{
  flex:none;width:190px;height:100%;display:flex;flex-direction:column;
  border:1px solid rgba(15,23,42,.1);border-radius:10px;padding:13px 13px 12px;
}
.side-panel-head{flex:none;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.side-panel-head .label{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2}
.side-panel-head .count{font-size:11px;font-weight:500}
.side-panel-body{flex:1;min-height:0;overflow:auto;font-size:12.5px;line-height:1.5}

/* step 3 */
.step3-layout{display:flex;gap:22px;height:100%}
.questions-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:16px}
.q-row{display:flex;align-items:center;gap:12px}
.q-text{font-size:13.5px;font-weight:500;line-height:1.2}
.q-num{color:rgba(15,23,42,.38);font-weight:600;margin-right:5px}
.q-options{flex:none;display:flex;gap:7px}
.q-options-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.opt-btn{
  width:62px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;border-radius:7px;cursor:pointer;transition:background 130ms,border-color 130ms;
  font-family:'Hanken Grotesk',sans-serif;
}
.opt-btn-grid{
  width:100%;height:30px;display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.1;padding:3px 4px;font-size:12px;border-radius:7px;cursor:pointer;
  transition:background 130ms,border-color 130ms;font-family:'Hanken Grotesk',sans-serif;
}

.details-col{
  flex:none;width:270px;height:100%;display:flex;flex-direction:column;
  border:1px solid rgba(15,23,42,.1);border-radius:10px;padding:12px 14px;overflow:hidden;
}
.details-title{flex:none;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.2;margin-bottom:10px}
.details-sublabel{flex:none;font-size:11.5px;color:rgba(15,23,42,.5);margin-bottom:5px}
.notes{
  flex:1;min-height:0;padding:9px 11px;font:400 12.5px/1.4 'Hanken Grotesk',sans-serif;
  color:var(--ink);background:#f1f5f9;border:1px solid rgba(15,23,42,.08);border-radius:8px;resize:none;
}
.doc-row{flex:none;margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer}
.doc-icon{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:7px;font-size:15px;line-height:1}
.doc-text{min-width:0;flex:1}
.doc-title{display:block;font-size:13px;font-weight:500;line-height:1.2}
.doc-sub{display:block;font-size:11px;color:rgba(15,23,42,.48);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div class="frame" id="wizard">
  <div class="wizard-header">
    <div class="wizard-title">
      <span class="title-main" id="title"></span>
      <span class="title-sub" id="subtitle"></span>
    </div>
    <div class="pips" id="pips"></div>
  </div>
  <div class="wizard-body" id="body"></div>
  <div class="wizard-footer">
    <button class="btn btn-back" id="backBtn">Back</button>
    <div class="hint" id="hint"></div>
    <button class="btn btn-next" id="nextBtn"></button>
  </div>
</div>

    case 'pole': return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="9" x2="12" y2="21"></line><circle cx="12" cy="6" r="3.2"></circle><line x1="8" y1="21" x2="16" y2="21"></line></svg>';
    case 'falling': return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3.5" width="6" height="6" rx="1" transform="rotate(12 12 6.5)"></rect><line x1="6.5" y1="12.5" x2="6.5" y2="15"></line><line x1="12" y1="13" x2="12" y2="15.5"></line><line x1="17.5" y1="12.5" x2="17.5" y2="15"></line><line x1="4" y1="20" x2="20" y2="20"></line></svg>';
    case 'fire': return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 c2 3 4 4.5 4 8 a4 4 0 0 1 -8 0 c0 -2 1 -3 1.5 -4 c.4 1 1 1.6 1.6 2 c.2 -2.2 -.6 -4.4 -1.1 -6z"></path></svg>';
    case 'theft': return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.6"></rect><path d="M8 11 V8 a4 4 0 0 1 6.9 -2.7"></path><line x1="13.5" y1="14.5" x2="16" y2="17"></line><line x1="16" y1="14.5" x2="13.5" y2="17"></line></svg>';
    case 'other': return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="18.5" cy="12" r="1.4"></circle></svg>';
    default: return '';
  }
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') node.className = attrs[k];
    else if (k === 'html') node.innerHTML = attrs[k];
    else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) node.appendChild(c); });
  return node;
}

class ClaimsWizard {
  constructor(root) {
    this.root = root;
    this.state = { step: 1, cause: null, faces: {}, answers: {}, notes: '', doc: null };
    this.els = {
      title: root.querySelector('#title'),
      subtitle: root.querySelector('#subtitle'),
      pips: root.querySelector('#pips'),
      body: root.querySelector('#body'),
      backBtn: root.querySelector('#backBtn'),
      nextBtn: root.querySelector('#nextBtn'),
      hint: root.querySelector('#hint'),
    };
    this.els.backBtn.addEventListener('click', () => { if (this.state.step > 1) this.setState({ step: this.state.step - 1 }); });
    this.els.nextBtn.addEventListener('click', () => this.next());
    this.render();
  }

  setState(patch) {
    Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch);
    this.render();
  }

  chosen() {
    return FACES.filter(f => this.state.faces[f.id]).map(f => f.id);
  }

  ok() {
    const s = this.state;
    if (s.step === 1) return !!s.cause;
    if (s.step === 2) return this.chosen().length > 0;
    return QUESTIONS.every(q => {
      const a = s.answers[q.id];
      return q.multi ? (Array.isArray(a) && a.length > 0) : !!a;
    });
  }

  next() {
    if (!this.ok()) return;
    if (this.state.step < 3) this.setState({ step: this.state.step + 1 });
    else this.setState({ step: 1, cause: null, faces: {}, answers: {}, notes: '', doc: null });
  }

  render() {
    const s = this.state, step = s.step;
    const chosen = this.chosen();
    const ok = this.ok();

    const titles = { 1: 'How did the damage happen?', 2: 'Where is the damage?', 3: 'A few last things' };
    const subs = { 1: 'Step 1 of 3', 2: 'Step 2 of 3', 3: 'Step 3 of 3' };
    const hints = {
      1: s.cause ? 'Selected: ' + (CAUSES.find(c => c.id === s.cause) || {}).label : 'Pick the one that hit you.',
      2: chosen.length ? chosen.length + ' area' + (chosen.length === 1 ? '' : 's') + ' marked' : 'Tap + on each damaged area of the car.',
      3: ok ? 'Ready to file.' : 'All three answers are needed.',
    };

    this.els.title.textContent = titles[step];
    this.els.subtitle.textContent = subs[step];

    this.els.pips.innerHTML = '';
    [1, 2, 3].forEach(n => {
      const btn = el('button', {
        class: 'pip',
        style: `background:${n === step ? CLAY : (n < step ? 'rgba(37,99,235,.45)' : 'rgba(15,23,42,.14)')};cursor:${n < step ? 'pointer' : 'default'}`,
        onClick: () => { if (n < step) this.setState({ step: n }); },
      });
      this.els.pips.appendChild(btn);
    });

    this.els.body.innerHTML = '';
    if (step === 1) this.els.body.appendChild(this.renderStep1());
    else if (step === 2) this.els.body.appendChild(this.renderStep2(chosen));
    else this.els.body.appendChild(this.renderStep3());

    this.els.backBtn.style.cursor = step === 1 ? 'not-allowed' : 'pointer';
    this.els.backBtn.style.opacity = step === 1 ? '0.35' : '1';
    this.els.hint.textContent = hints[step];
    this.els.hint.style.color = ok ? 'rgba(15,23,42,.45)' : CLAY_D;
    this.els.nextBtn.textContent = step === 3 ? 'Submit' : 'Continue';
    this.els.nextBtn.style.background = ok ? CLAY : 'rgba(37,99,235,.42)';
    this.els.nextBtn.style.cursor = ok ? 'pointer' : 'not-allowed';
  }

  renderStep1() {
    const wrap = el('div', {});
    wrap.appendChild(el('div', { class: 'step1-label' }, [document.createTextNode('Another vehicle, a road user, an object, or an event')]));
    const grid = el('div', { class: 'cause-grid' });
    CAUSES.forEach(c => {
      const on = this.state.cause === c.id;
      const btn = el('button', {
        class: 'cause-btn',
        style: `border:1px solid ${on ? CLAY : HAIR};background:${on ? CLAY : CREAM};color:${on ? CREAM : INK};`,
        onClick: () => this.setState({ cause: c.id }),
      }, [
        el('span', { class: 'cause-icon', html: iconSvg(c.icon) }),
        el('span', { class: 'cause-label' }, [document.createTextNode(c.label)]),
      ]);
      grid.appendChild(btn);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  renderStep2(chosen) {
    const layout = el('div', { class: 'step2-layout' });

    const mapCol = el('div', { class: 'map-col' });
    const mapWrap = el('div', { class: 'map-wrap' });
    mapWrap.appendChild(el('img', { src: CAR_IMG, alt: 'Top view of the car' }));
    FACES.forEach(f => {
      const on = !!this.state.faces[f.id];
      const btn = el('button', {
        class: 'hotspot',
        style: `left:${f.left}%;top:${f.top}%;` +
          (on
            ? `border:1.5px solid #DC2626;background:#DC2626;color:${CREAM};box-shadow:0 0 0 4px rgba(220,38,38,.18);`
            : `border:1.5px solid rgba(37,99,235,.6);background:rgba(255,255,255,.92);color:${CLAY};box-shadow:0 1px 3px rgba(15,23,42,.14);`),
        onClick: () => this.setState(p => {
          const faces = { ...p.faces };
          if (faces[f.id]) delete faces[f.id]; else faces[f.id] = true;
          return { faces };
        }),
      }, [document.createTextNode('+')]);
      mapWrap.appendChild(btn);
    });
    mapCol.appendChild(mapWrap);
    layout.appendChild(mapCol);

    const captionColor = chosen.length ? CLAY_D : 'rgba(15,23,42,.5)';
    const side = el('div', { class: 'side-panel' }, [
      el('div', { class: 'side-panel-head' }, [
        el('span', { class: 'label' }, [document.createTextNode('Selected areas')]),
        el('span', { class: 'count', style: `color:${captionColor}` }, [document.createTextNode(chosen.length + ' marked')]),
      ]),
      el('div', { class: 'side-panel-body', style: `color:${captionColor}` }, [
        document.createTextNode(chosen.length ? chosen.map(faceLabel).join(', ') : 'Tap + on each damaged area of the car.'),
      ]),
    ]);
    layout.appendChild(side);

    return layout;
  }

  renderStep3() {
    const layout = el('div', { class: 'step3-layout' });
    const col = el('div', { class: 'questions-col' });

    const q1 = QUESTIONS[0];
    const q1Row = el('div', { class: 'q-row' }, [
      el('div', { class: 'q-text' }, [
        el('span', { class: 'q-num' }, [document.createTextNode('1.')]),
        document.createTextNode(q1.text),
      ]),
      el('div', { class: 'q-options' }, q1.options.map(v => {
        const on = this.state.answers[q1.id] === v;
        return el('button', {
          class: 'opt-btn',
          style: `font-weight:${on ? '600' : '500'};color:${on ? CREAM : INK};background:${on ? CLAY : CREAM};border:1px solid ${on ? CLAY : HAIR};`,
          onClick: () => this.setState(p => ({ answers: { ...p.answers, [q1.id]: v } })),
        }, [document.createTextNode(v)]);
      })),
    ]);
    col.appendChild(q1Row);

    QUESTIONS.slice(1).forEach((q, i) => {
      const block = el('div', { class: 'q-block' });
      block.appendChild(el('div', { class: 'q-text', style: 'margin-bottom:6px' }, [
        el('span', { class: 'q-num' }, [document.createTextNode((i + 2) + '.')]),
        document.createTextNode(q.text),
      ]));
      const grid = el('div', { class: 'q-options-grid' });
      q.options.forEach(v => {
        const a = this.state.answers[q.id];
        const on = Array.isArray(a) && a.includes(v);
        const btn = el('button', {
          class: 'opt-btn-grid',
          style: `font-weight:${on ? '600' : '500'};color:${on ? CREAM : INK};background:${on ? CLAY : CREAM};border:1px solid ${on ? CLAY : HAIR};`,
          onClick: () => this.setState(p => {
            let arr = Array.isArray(p.answers[q.id]) ? [...p.answers[q.id]] : [];
            if (v === 'None') { arr = arr.includes('None') ? [] : ['None']; }
            else { arr = arr.filter(x => x !== 'None'); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]; }
            return { answers: { ...p.answers, [q.id]: arr } };
          }),
        }, [document.createTextNode(v)]);
        grid.appendChild(btn);
      });
      block.appendChild(grid);
      col.appendChild(block);
    });

    layout.appendChild(col);

    const doc = this.state.doc;
    const details = el('div', { class: 'details-col' });
    details.appendChild(el('div', { class: 'details-title' }, [document.createTextNode('Supporting details')]));
    details.appendChild(el('div', { class: 'details-sublabel' }, [document.createTextNode('Additional comments')]));
    const textarea = el('textarea', {
      class: 'notes',
      placeholder: 'Anything more about how the damage happened',
      onChange: e => this.setState({ notes: e.currentTarget.value }),
    });
    textarea.value = this.state.notes;
    details.appendChild(textarea);

    const fileInput = el('input', {
      type: 'file', accept: 'application/pdf', style: 'display:none',
      onChange: e => { const f = e.currentTarget.files[0]; if (f) this.setState({ doc: f.name }); },
    });
    const docLabel = el('label', {
      class: 'doc-row',
      style: `border:1.5px ${doc ? 'solid' : 'dashed'} ${doc ? 'rgba(37,99,235,.45)' : 'rgba(15,23,42,.28)'};background:${doc ? TINT : CREAM};`,
    }, [
      el('span', { class: 'doc-icon', style: `background:${doc ? CLAY : 'rgba(15,23,42,.06)'};color:${doc ? CREAM : FAINT}` }, [document.createTextNode(doc ? '✓' : '+')]),
      el('span', { class: 'doc-text' }, [
        el('span', { class: 'doc-title' }, [document.createTextNode(doc ? 'Document attached' : 'Attach a PDF')]),
        el('span', { class: 'doc-sub' }, [document.createTextNode(doc || 'Claim form or police report')]),
      ]),
      fileInput,
    ]);
    details.appendChild(docLabel);

    layout.appendChild(details);
    return layout;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  new ClaimsWizard(document.getElementById('wizard'));
});
</script>
